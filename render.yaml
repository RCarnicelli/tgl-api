services:
  - type: web
    name: guitar-diagram-api
    env: python
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: |
      uvicorn app:app --host 0.0.0.0 --port 10000

    envVars:
      - key: PORT
        value: 10000

    healthCheckPath: /
    autoDeploy: true

    # Logs em tempo real no painel do Render
    disk:
      name: temp
      mountPath: /tmp
      sizeGB: 1
